[project]
name = "pycistarget"
version = "1.2.0"
description = "pycistarget is a python module to perform motif enrichment analysis in sets of regions with different tools and identify high confidence TF cistromes"
authors = [
    { name = "Seppe De Winter" },
    { name = "Carmen Bravo" },
]
license = { text = "Academic Non-commercial" }
readme = "README.rst"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    # pyarrow 25 and 26 use ~7x more memory (and time) when reading a subset of columns
    # from a cisTarget database (e.g. 9.3 GB instead of 1.3 GB for 20k regions).
    "pyarrow>=15,<25",
    "pyranges>=0.1.2,<0.2",
    "h5py>=3.10",
    "tables>=3.9",
    "numba>=0.59",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
notebook = ["ipython>=8"]

[project.scripts]
pycistarget = "pycistarget.cli.pycistarget:main"

[project.urls]
Repository = "https://github.com/aertslab/pycistarget"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD002", "RUF100"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
